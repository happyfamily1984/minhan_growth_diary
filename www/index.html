<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe4" />
  <title>민한이 성장일기</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="title">민한이 성장일기</div>
    </header>

    <main>
      <!-- 오늘 -->
      <section id="view-home" class="view">
        <div class="hero card">
          <div class="hero-date" id="heroDate"></div>
          <div class="hero-day">탄생 <b id="heroDay"></b>일째</div>
          <div class="hero-age" id="heroAge"></div>
          <div class="hero-live muted" id="heroLive"></div>
          <div class="hero-next" id="heroNext"></div>
        </div>

        <button class="write-box" id="writeToday">
          <span class="pen">✏️</span>
          <span>오늘 민한이가 한 말이나 한 일을 적어 주세요…</span>
        </button>

        <h2 class="section-title">오늘 한 말 · 한 일</h2>
        <div id="todayList" class="entries"></div>

        <div id="memoriesWrap" hidden>
          <h2 class="section-title">지난해 오늘</h2>
          <div id="memories" class="entries"></div>
        </div>
      </section>

      <!-- 달력 -->
      <section id="view-calendar" class="view" hidden>
        <div class="card">
          <div class="cal-head">
            <button class="icon-btn" id="calPrev" aria-label="이전 달">‹</button>
            <button class="cal-title" id="calTitle"></button>
            <button class="icon-btn" id="calNext" aria-label="다음 달">›</button>
          </div>
          <div class="cal-grid cal-week">
            <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-foot muted" id="calFoot"></div>
        </div>

        <div class="day-head">
          <div>
            <div class="day-title" id="dayTitle"></div>
            <div class="muted" id="daySub"></div>
          </div>
          <button class="btn primary small" id="writeDay">＋ 쓰기</button>
        </div>
        <div id="dayList" class="entries"></div>
      </section>

      <!-- 가져오기 -->
      <section id="view-import" class="view" hidden>
        <div class="card">
          <p>텔레그램 대화를 <b>복사해서 붙여넣거나</b>, <b>캡쳐 사진</b>을 올리면 글을 읽어서 날짜에 맞게 넣어 드려요.</p>
          <textarea id="pasteBox" class="paste-box" rows="6" placeholder="여기에 길게 눌러 붙여넣기&#10;(글이나 캡쳐 사진 모두 돼요)"></textarea>
          <div class="import-actions">
            <button class="btn primary" id="parseBtn">글 인식하기</button>
            <label class="btn file-btn">📷 캡쳐 사진 선택<input type="file" id="ocrFile" accept="image/*" multiple hidden /></label>
          </div>
          <label class="fallback-date">날짜가 안 보이면 <input type="date" id="fallbackDate" /> 로 넣기</label>
          <p class="muted small">캡쳐에 날짜가 안 보이면 사진을 찍은 날짜를 써요. 글자 읽기는 이 폰 안에서만 처리돼요.</p>
        </div>
        <div id="importResult"></div>
      </section>

      <!-- 검색 -->
      <section id="view-search" class="view" hidden>
        <div class="card search-box">
          <input type="search" id="searchInput" placeholder="단어로 찾기 (예: 엄마, 공룡)" />
        </div>
        <div class="muted center" id="searchInfo"></div>
        <div id="searchList" class="entries"></div>
        <div class="card backup">
          <p class="small muted">기록은 이 폰 안에만 저장돼요. 앱을 지우거나 폰을 바꾸기 전에 꼭 백업해 두세요.</p>
          <button class="btn" id="backupBtn">💾 백업 파일 만들기</button>
          <label class="btn file-btn">📂 백업에서 되살리기<input type="file" id="restoreFile" accept=".json,application/json" hidden /></label>
        </div>
      </section>
    </main>

    <nav class="bottom">
      <button data-view="home" class="active"><span>🏠</span>오늘</button>
      <button data-view="calendar"><span>📅</span>달력</button>
      <button class="nav-write" id="navWrite" aria-label="쓰기"><span>✏️</span></button>
      <button data-view="import"><span>📥</span>가져오기</button>
      <button data-view="search"><span>🔍</span>찾기</button>
    </nav>
  </div>

  <!-- 쓰기창 -->
  <dialog id="editor">
    <form id="editorForm">
      <div class="editor-head">
        <input type="date" name="date" required />
        <span class="muted" id="editorDay"></span>
      </div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="kind" value="say" checked /><span>💬 한 말</span></label>
        <label><input type="radio" name="kind" value="did" /><span>🌱 한 일</span></label>
      </div>
      <label class="field">
        <span id="textLabel">민한이가 한 말</span>
        <textarea name="text" rows="5" required></textarea>
      </label>
      <label class="field">
        <span>상황 메모 <small class="muted">(선택)</small></span>
        <textarea name="note" rows="2" placeholder="저녁 먹고 산책하다가"></textarea>
      </label>
      <label class="field inline">
        <span>시간 <small class="muted">(선택)</small></span>
        <input type="time" name="time" />
      </label>
      <div class="editor-actions">
        <button type="button" class="btn danger" id="editorDelete" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="editorCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
