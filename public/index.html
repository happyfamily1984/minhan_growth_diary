<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe4" />
  <title>민한이 성장일기</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="loginForm" class="card">
      <h1>민한이 성장일기</h1>
      <p class="muted">가족 비밀번호를 입력해 주세요</p>
      <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required />
      <button class="btn primary" type="submit">들어가기</button>
      <p class="error" id="loginError"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="title">민한이 성장일기</div>
    </header>

    <main>
      <!-- 오늘 -->
      <section id="view-home" class="view">
        <div class="hero card">
          <div class="hero-date" id="heroDate"></div>
          <div class="hero-day">탄생 <b id="heroDay"></b>일째</div>
          <div class="hero-age" id="heroAge"></div>
          <div class="hero-live muted" id="heroLive"></div>
          <div class="hero-next" id="heroNext"></div>
        </div>

        <button class="write-box" id="writeToday">
          <span class="pen">✏️</span>
          <span>오늘 민한이가 한 말을 적어 주세요…</span>
        </button>

        <h2 class="section-title">오늘 한 말</h2>
        <div id="todayList" class="entries"></div>

        <div id="memoriesWrap" hidden>
          <h2 class="section-title">지난해 오늘</h2>
          <div id="memories" class="entries"></div>
        </div>
      </section>

      <!-- 달력 -->
      <section id="view-calendar" class="view" hidden>
        <div class="card">
          <div class="cal-head">
            <button class="icon-btn" id="calPrev" aria-label="이전 달">‹</button>
            <button class="cal-title" id="calTitle"></button>
            <button class="icon-btn" id="calNext" aria-label="다음 달">›</button>
          </div>
          <div class="cal-grid cal-week">
            <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-foot muted" id="calFoot"></div>
        </div>

        <div class="day-head">
          <div>
            <div class="day-title" id="dayTitle"></div>
            <div class="muted" id="daySub"></div>
          </div>
          <button class="btn primary small" id="writeDay">＋ 쓰기</button>
        </div>
        <div id="dayList" class="entries"></div>
      </section>

      <!-- 가져오기 -->
      <section id="view-import" class="view" hidden>
        <div class="tabs" role="tablist">
          <button class="tab active" data-sub="ocr">캡쳐 사진</button>
          <button class="tab" data-sub="inbox">텔레그램 받은 메시지</button>
          <button class="tab" data-sub="export">대화 내보내기 파일</button>
        </div>

        <div class="sub" data-sub="ocr">
          <div class="card">
            <p>텔레그램 대화 <b>캡쳐 사진</b>을 올리면 글자를 읽어서 줄마다 나눠 드려요. 민한이가 한 말만 골라 저장하세요.</p>
            <label class="btn primary file-btn">
              사진 선택
              <input type="file" id="ocrFile" accept="image/*" multiple hidden />
            </label>
            <p class="muted small">사진 속 글자 읽기는 이 기기 안에서 처리돼요. 처음에는 한글 사전을 내려받느라 조금 걸려요.</p>
          </div>
          <div id="ocrResult"></div>
        </div>

        <div class="sub" data-sub="inbox" hidden>
          <div class="card" id="tgStatus"></div>
          <div id="inboxList"></div>
        </div>

        <div class="sub" data-sub="export" hidden>
          <div class="card">
            <p>텔레그램 PC 앱에서 대화방 › ⋮ › <b>대화 내보내기</b> › 형식 <b>JSON</b> 으로 받은 <code>result.json</code> 파일을 올리세요. 날짜는 메시지를 보낸 날로 저장돼요.</p>
            <label class="btn primary file-btn">
              result.json 선택
              <input type="file" id="exportFile" accept=".json,application/json" hidden />
            </label>
          </div>
          <div id="exportResult"></div>
        </div>
      </section>

      <!-- 검색 -->
      <section id="view-search" class="view" hidden>
        <div class="card search-box">
          <input type="search" id="searchInput" placeholder="단어로 찾기 (예: 엄마, 공룡)" />
        </div>
        <div class="muted center" id="searchInfo"></div>
        <div id="searchList" class="entries"></div>
        <div class="card backup">
          <a class="btn" href="/api/backup">전체 기록 백업 받기 (JSON)</a>
        </div>
      </section>
    </main>

    <nav class="bottom">
      <button data-view="home" class="active"><span>🏠</span>오늘</button>
      <button data-view="calendar"><span>📅</span>달력</button>
      <button class="nav-write" id="navWrite" aria-label="쓰기"><span>✏️</span></button>
      <button data-view="import"><span>📥</span>가져오기</button>
      <button data-view="search"><span>🔍</span>찾기</button>
    </nav>
  </div>

  <!-- 쓰기창 -->
  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <div class="editor-head">
        <input type="date" name="date" required />
        <span class="muted" id="editorDay"></span>
      </div>
      <label class="field">
        <span>민한이가 한 말</span>
        <textarea name="text" rows="5" placeholder="“엄마, 구름이 솜사탕처럼 생겼어!”" required></textarea>
      </label>
      <label class="field">
        <span>상황 메모 <small class="muted">(선택)</small></span>
        <textarea name="note" rows="2" placeholder="저녁 먹고 산책하다가"></textarea>
      </label>
      <label class="field inline">
        <span>시간 <small class="muted">(선택)</small></span>
        <input type="time" name="time" />
      </label>
      <div class="editor-actions">
        <button type="button" class="btn danger" id="editorDelete" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="editorCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
